# ============================================================
#  EatGym – Docker Compose (Full Stack)
#  PostgreSQL 16 + Node.js API + FastAPI AI Service
# ============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: eatgym-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eatgym}
      POSTGRES_USER: ${POSTGRES_USER:-eatgym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eatgym} -d ${POSTGRES_DB:-eatgym}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eatgym-net
    ports:
      - "5432:5432"

  # ---- API Server ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eatgym-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-eatgym}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-eatgym}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      JWT_ISSUER: ${JWT_ISSUER:-eatgym-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-eatgym-mobile}
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - eatgym-net

  # ---- AI Service (FastAPI + YOLOv8) ----
  ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: eatgym-ai
    restart: unless-stopped
    environment:
      YOLO_MODEL_PATH: /app/models/yolov8_food.pt
    ports:
      - "${AI_PORT:-8000}:8000"
    networks:
      - eatgym-net

  # ---- Migration Runner (run once) ----
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eatgym-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eatgym}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-eatgym}
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
    command: ["node", "src/db/migrate.js"]
    networks:
      - eatgym-net
    profiles:
      - migrate

  # ---- Ngrok Tunnel (Tên miền cố định miễn phí, đổi PC sang Mac không đổi IP) ----
  ngrok:
    image: ngrok/ngrok:latest
    container_name: eatgym-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "api:3000"
      - "--url=${NGROK_DOMAIN:-kindly-absolve-concur.ngrok-free.dev}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-3KTagn069OqtZ0BMJzDkct9Cfpe_4WrpDoTAEeJRBJwuq5He4}
    depends_on:
      - api
    networks:
      - eatgym-net

networks:
  eatgym-net:
    driver: bridge

volumes:
  postgres_data:

